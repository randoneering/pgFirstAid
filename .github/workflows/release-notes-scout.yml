name: release-notes-scout

# Weekly Monday evening UTC scout of PostgreSQL release notes.
# Proposes high/medium severity bug fixes that match data/known_bugs.json
# entries missing from the curated list. A PR is opened for human review;
# never auto-merges.

on:
  schedule:
    - cron: '0 22 * * 1'  # Mondays 22:00 UTC, after PGDG's Tuesday batch.
  workflow_dispatch:
  # Note: deliberately no `pull_request:` trigger. The default GITHUB_TOKEN
  # on PR events is read-only, so this workflow's "open a new PR" step
  # would fail with "GitHub Actions is not permitted to create or approve
  # pull requests." If you want a PR-validation pass, add a separate
  # workflow that just runs the scout in --check mode.

concurrency:
  group: release-notes-scout
  cancel-in-progress: false

permissions: {}

jobs:
  scout:
    permissions:
      contents: write
      pull-requests: write
    name: Scout release-notes for high-severity bug fixes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.9"
          checksum: "ec7a99cd05e0cd7f80243f135ce1361c76835cb0ee60055d14d20eba8eba1460"
          enable-cache: true

      - name: Sync deps
        run: uv sync --quiet

      - name: Run scout and publish branch (CI mode)
        # --check exit codes:
        #   0 = no proposed additions
        #   1 = proposed additions, written to stdout (this is what we want
        #       to open a PR for)
        #   2+ = hard failure (parse error, network error, missing
        #       sentinel, etc.). Propagate as a workflow failure WITHOUT
        #       writing the (likely empty or partial) stdout, so the
        #       resulting commit doesn't carry a misleading file.
        #
        # This step writes the file, commits it on the source branch ref,
        # and pushes to origin. The next step opens (or updates) the PR.
        #
        # History: the original workflow used peter-evans/create-pull-request
        # with untracked proposed-*.json. That worked when the source branch
        # existed on origin but silently no-op'd when it didn't: peter-evans
        # stashed uncommitted changes, failed to find the remote ref, and
        # bailed with "Branch is not ahead of base and will not be created".
        # Both source branches were deleted after PRs #42 and #45 merged in
        # Aug-Sep, so every scheduled run since then has silently failed.
        #
        # The fix: bypass peter-evans. Write the file, move HEAD onto the
        # source branch ref (so the commit lands on a real ref, not detached
        # on HEAD), force-push to origin, then open the PR with `gh pr create`.
        # --force-with-lease is safe: on the first push the remote ref is
        # absent and the lease is vacuous; on later runs it protects against
        # overwriting a concurrent human edit.
        id: scout
        run: |
          set +e
          PROPOSED=$(uv run python tools/scrape_release_notes.py --check 2>/dev/null)
          rc=$?
          set -e
          echo "scout exit code: $rc"
          if [ $rc -eq 1 ]; then
            echo "needs_pr=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$PROPOSED" > proposed-bugs.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Fetch the source branch's current state on origin so
            # --force-with-lease below has a real remote-tracking ref to
            # compare against. The fetch fails silently on the first push
            # (branch doesn't exist yet), which is the correct behavior.
            git fetch origin chore/release-notes-scout:refs/remotes/origin/chore/release-notes-scout 2>/dev/null || true
            # Move HEAD onto the source branch ref so the commit lands on
            # a real branch. Base on the just-fetched remote ref if it
            # exists (subsequent runs), or on origin/main if not (first
            # push). Without this split, --force-with-lease has nothing
            # meaningful to compare against on the first push.
            if git show-ref --verify --quiet refs/remotes/origin/chore/release-notes-scout; then
              git checkout -B chore/release-notes-scout origin/chore/release-notes-scout
            else
              git checkout -B chore/release-notes-scout origin/main
            fi
            git add -f proposed-bugs.json
            git commit -m "chore: scout release notes for new bug fixes"
            # --force-with-lease now has a meaningful lease because the
            # remote-tracking ref was refreshed above. If origin has moved
            # since our fetch (concurrent human edit), this fails safely
            # instead of silently overwriting.
            git push --force-with-lease origin chore/release-notes-scout
          elif [ $rc -eq 0 ]; then
            echo "needs_pr=false" >> "$GITHUB_OUTPUT"
          else
            echo "scout: hard failure (exit code $rc); not opening a PR" >&2
            exit "$rc"
          fi

      - name: Open PR with proposed bug entries
        if: steps.scout.outputs.needs_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh pr list --head chore/release-notes-scout --state open --json number -q 'length')" -gt 0 ]; then
            echo "an open PR for chore/release-notes-scout already exists; nothing to do"
            exit 0
          fi
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head chore/release-notes-scout \
            --title "chore: add notable PostgreSQL bug fixes" \
            --label automated \
            --body "Automated PostgreSQL release-notes scout.

          \`tools/scrape_release_notes.py\` fetched the latest ~2 minor
          release notes per major in {15,16,17,18}, filtered the
          \`<li class=\"listitem\">\` entries by severity keywords, deduped
          against \`data/known_bugs.json\`, and surfaced the top 5 per
          major for review. The candidates are in \`proposed-bugs.json\`.

          **Action items for a human:**
          - [ ] Decide which entries earn a permanent seat. The list
                is biased toward data-integrity / crash / replication
                bugs; doc-only or trivial entries should be dropped.
          - [ ] Rename curator IDs if needed (e.g. \`PG17-a1b2c3d4e\`
                → \`PG17-MERGE-RACE-CONDITION-01\`) before merging.
          - [ ] Merge selected entries into \`data/known_bugs.json\`:
                \`\`\`bash
                uv run python tools/scrape_release_notes.py --write --yes
                uv run python tools/generate_cve_sql.py
                git add data/known_bugs.json pgFirstAid.sql view_pgFirstAid.sql view_pgFirstAid_managed.sql
                git commit -m \"chore: refresh known-bugs catalog\"
                \`\`\`
          - [ ] Delete \`proposed-bugs.json\` before merge.

          Notes on the keyword filter (\`HIGH\`/\`MEDIUM\` lists live in
          \`tools/scrape_release_notes.py\`): the curated list is small,
          intent is curated quality over recall, and silent false
          negatives are preferred over noisy false positives. Tune the
          keyword lists if the proposals get noisy or thin."
